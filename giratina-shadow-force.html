        gWingFlare = lerp(gWingFlare, 0.42, prep);
        gGhostAura = prep * 0.45;
        gEyeGlow = 0.85 + prep * 0.55;
        shakeAmp = prep * 1.8;
      } else {
        const diveP = easeInOutQuart(clamp((t - 5.6) / 3.9, 0, 1));
        gPoseMode = 'dive';
        gPoseBlend = smoothstep(5.6, 6.6, t);
        gX = lerp(W * 0.37, riftX + 410 * unit, diveP);
        gY = H * 0.495 + Math.sin(diveP * Math.PI) * -12 * unit;
        // Turns semi-transparent & spectral as it slips segment-by-segment into the rift!
        gAlpha = lerp(1.0, 0.40, smoothstep(5.8, 7.3, t)) * (1 - smoothstep(9.0, 9.65, t));
        gGhostAura = 0.45 + 0.55 * smoothstep(5.8, 7.2, t);
        gWingFlare = lerp(0.42, 0.14, diveP);
        gEyeGlow = 1.4;
        gClipRift = { rx: riftX, ry: riftY, height: riftH, t, side: 'left' };
        shakeAmp = (1 - diveP) * 2.2 + smoothstep(9.45, 9.7, t) * (1 - smoothstep(9.7, 10.3, t)) * 5.0;
      }
    }

    // ---------------------------------------------------------------------
    // ACT 2: Darkness & Glowing Red Eyes — Tension Beat (10.6s -> 15.8s)
    // ---------------------------------------------------------------------
    else if (t >= 10.6 && t < 15.8) {
      actIndex = 1;
      phaseText = 'II. 漆黒の静寂 — 紅い眼光';
      dotClass = 'crimson';
      gAlpha = 0; // Giratina is completely vanished in the shadow dimension

      // Darkness engulfs the Distortion World
      darkness = smootherstep(10.6, 12.1, t) * 0.96;

      // Slow tense creep-in camera
      const creep = smootherstep(10.8, 15.6, t);
      camZoom = 1.0 + creep * 0.14;
      camX = 0;
      camY = 0;

      // Glowing crimson eyes appear alone in the pitch-black void (12.1s -> 15.8s)
      darkEyesAmt = smootherstep(12.0, 13.0, t);
      darkEyesFlare = smootherstep(14.55, 15.75, t);

      // Hairline purple/crimson dimensional cracks spiderweb outward right before eruption
      crackProg = smoothstep(14.75, 15.78, t);
      crackFade = smoothstep(14.75, 15.05, t);
      shakeAmp = Math.pow(darkEyesFlare, 2) * 8.5;
    }

    // ---------------------------------------------------------------------
    // ACT 3: Rift Eruption & Colossal Shadow Force Slash/Blast (15.8s -> 21.8s)
    // ---------------------------------------------------------------------
    else if (t >= 15.8 && t < 21.8) {
      actIndex = 2;
      phaseText = 'III. 影撃 — シャドーダイブ';
      dotClass = 'gold';

      // Darkness violently blows away on eruption
      darkness = (1 - easeOutCubic(clamp((t - 15.8) / 0.75, 0, 1))) * 0.96;

      // Residual cracks blaze briefly and vanish
      crackProg = 1.0;
      crackFade = 1 - smoothstep(15.85, 17.1, t);

      // Huge eruption rift tears wide open on left-center (15.8s -> 20.6s)
      riftX = W * 0.24;
      riftY = H * 0.49;
      riftW = 155 * unit;
      riftH = 490 * unit;
      riftOpen = easeOutExpo(clamp((t - 15.8) / 0.45, 0, 1)) * (1 - smootherstep(18.5, 20.6, t));
      riftIntensity = 1.4;

      // Giratina erupts forward dramatically out of the rift!
      const emerge = easeOutCubic(clamp((t - 15.85) / 0.85, 0, 1));
      const settle = smootherstep(19.5, 21.8, t);

      gPoseMode = 'erupt';
      gPoseBlend = emerge * (1 - settle);
      gAlpha = smoothstep(15.82, 16.12, t);
      gX = lerp(W * 0.20, W * 0.36, emerge) + lerp(0, W * 0.08, settle);
      gY = lerp(H * 0.51, H * 0.48, emerge) + Math.sin((t - 15.8) * 3.2) * 8 * unit * (1 - settle);
      gScale = lerp(0.62, 1.15, emerge) - settle * 0.14;
      gWingFlare = lerp(0.3, 1.0, emerge) * (1 - settle * 0.65);
      gGhostAura = (1 - smoothstep(15.85, 17.2, t)) * 0.85 + (1 - settle) * 0.22;
      gEyeGlow = 1.8 - settle * 0.65;
      gHeadTilt = lerp(-0.14, 0.08, emerge) * (1 - settle);

      // Slashes & Colossal Blast timing
      slash1Prog = clamp((t - 16.45) / 1.45, 0, 1);
      slash2Prog = clamp((t - 16.92) / 1.45, 0, 1);
      blastT = clamp((t - 17.22) / 4.2, 0, 1);

      // Lush violet-magenta environment bounce glow during blast
      blastGlow = Math.sin(clamp((t - 16.3) / 4.5, 0, 1) * Math.PI) * 1.05;

      // Crisp brief flash moments on eruption, Slash 1, Slash 2, and Blast core
      const f0 = Math.exp(-Math.pow((t - 15.88) / 0.10, 2)) * 0.34;
      const f1 = Math.exp(-Math.pow((t - 16.52) / 0.08, 2)) * 0.42;
      const f2 = Math.exp(-Math.pow((t - 16.98) / 0.08, 2)) * 0.46;
      const f3 = Math.exp(-Math.pow((t - 17.32) / 0.13, 2)) * 0.52;
      impactFlash = clamp(f0 + f1 + f2 + f3, 0, 0.62);

      // Dynamic punch-zoom & heavy cinematic screen shake
      const punch = Math.exp(-(t - 15.85) * 2.2) * 0.16 + Math.exp(-Math.max(0, t - 17.25) * 1.6) * (t >= 17.25 ? 0.14 : 0);
      camZoom = 1.02 + punch * (1 - settle);
      const sErupt = Math.exp(-(t - 15.85) * 3.4) * 16;
      const sSlash1 = t >= 16.45 ? Math.exp(-(t - 16.45) * 4.2) * 20 : 0;
      const sSlash2 = t >= 16.92 ? Math.exp(-(t - 16.92) * 4.2) * 22 : 0;
      const sBlast = t >= 17.22 ? Math.exp(-(t - 17.22) * 1.45) * 30 : 0;
      shakeAmp = (sErupt + sSlash1 + sSlash2 + sBlast) * (1 - settle * 0.85);

      // Climax banner smoothly pulses in on the Shadow Force strike
      climaxOpacity = smoothstep(16.45, 16.9, t) * (1 - smootherstep(19.4, 20.6, t));
    }

    // ---------------------------------------------------------------------
    // ACT 4: Quiet Reset & Seamless Loop Return (21.8s -> 26.0s)
    // ---------------------------------------------------------------------
    else if (t >= 21.8) {
      actIndex = 3;
      phaseText = 'IV. 収束 — 虚空への回帰';
      dotClass = '';

      const ret = smootherstep(21.8, 25.8, t);
      // Smoothly glide from end of Act 3 back to exact t = 0.0s coordinates!
      const startX = W * 0.44;
      const targetX = W * 0.44;
      const startY = H * 0.48;
      const targetY = H * 0.49 + Math.sin(loopPhase * 2) * 11 * unit;

      gX = lerp(startX, targetX, ret);
      gY = lerp(startY, targetY, ret);
      gScale = lerp(1.01, 0.96, ret);
      gWingFlare = lerp(0.35, 0.12 + 0.08 * Math.sin(loopPhase * 2), ret);
      gEyeGlow = lerp(1.15, 0.85, ret);
      gHeadTilt = lerp(0.0, Math.sin(loopPhase * 2) * 0.05, ret);
      camZoom = lerp(1.02, 1.0 + Math.sin(loopPhase) * 0.015, ret);
    }

    // Apply multi-frequency organic screen shake
    const shakeX = shakeAmp > 0.05
      ? (Math.sin(t * 68.3) * 0.55 + Math.cos(t * 113.7) * 0.45) * shakeAmp * unit
      : 0;
    const shakeY = shakeAmp > 0.05
      ? (Math.cos(t * 74.9) * 0.55 + Math.sin(t * 129.1) * 0.45) * shakeAmp * unit
      : 0;

    return {
      t, loopPhase,
      camZoom, camX: camX + shakeX, camY: camY + shakeY, shakeAmp,
      darkness, blastGlow, impactFlash,
      giratina: {
        x: gX, y: gY, scale: gScale, t, loopPhase,
        poseMode: gPoseMode, poseBlend: gPoseBlend,
        wingFlare: gWingFlare, alpha: gAlpha,
        ghostAura: gGhostAura, eyeGlow: gEyeGlow,
        facing: 1, headTilt: gHeadTilt, clipRift: gClipRift
      },
      rift: { open: riftOpen, x: riftX, y: riftY, w: riftW, h: riftH, intensity: riftIntensity },
      darkEyesAmt, darkEyesFlare, crackProg, crackFade,
      slash1Prog, slash2Prog, blastT,
      ui: { actIndex, phaseText, dotClass, climaxOpacity }
    };
  }

  // =========================================================================
  // Main Render Loop with Multi-Pass Additive Light Bloom
  // =========================================================================
  let startTime = null;
  let lastActIdx = -1;

  function updateUI(t, ui, darkness) {
    const pct = (t / LOOP_DURATION) * 100;
    progressFill.style.width = `${pct.toFixed(2)}%`;

    if (ui.actIndex !== lastActIdx) {
      lastActIdx = ui.actIndex;
      phaseLabel.textContent = ui.phaseText;
      phaseDot.className = 'phase-dot' + (ui.dotClass ? ' ' + ui.dotClass : '');
      actPips.forEach((pip, idx) => {
        pip.className = 'act-pip' + (idx === ui.actIndex ? ' active' + (ui.dotClass ? ' ' + ui.dotClass : '') : '');
      });
    }

    // Dim corner chrome subtly during Act 2 pitch-black tension beat so the glowing red eyes command full attention
    const chromeAlpha = 1 - darkness * 0.58;
    titleLockup.style.opacity = chromeAlpha.toFixed(3);
    metaCorner.style.opacity = (chromeAlpha * 0.9).toFixed(3);

    // Climax banner animation
    climaxBanner.style.opacity = ui.climaxOpacity.toFixed(3);
    const cScale = 0.96 + ui.climaxOpacity * 0.06;
    climaxBanner.style.transform = `translateX(-50%) scale(${cScale.toFixed(4)})`;
  }

  function renderFrame(now) {
    if (startTime === null) startTime = now;
    const elapsed = ((now - startTime) * 0.001) % LOOP_DURATION;
    const state = computeSceneState(elapsed);

    // Clear bloom buffers & set transform so world coordinates map seamlessly to bloom buffer
    bCtxA.setTransform(1, 0, 0, 1, 0, 0);
    bCtxA.clearRect(0, 0, bloomA.width, bloomA.height);
    const bScaleX = bloomA.width / W;
    const bScaleY = bloomA.height / H;

    ctx.save();
    bCtxA.save();

    // Apply virtual camera zoom + shake identically to main stage & bloom buffer
    const applyCam = (target, sx, sy) => {
      target.scale(sx, sy);
      target.translate(W * 0.5 + state.camX, H * 0.5 + state.camY);
      target.scale(state.camZoom, state.camZoom);
      target.translate(-W * 0.5, -H * 0.5);
    };
    applyCam(ctx, 1, 1);
    applyCam(bCtxA, bScaleX, bScaleY);

    // 1. Distortion World Environment
    drawDistortionWorld(ctx, bCtxA, elapsed, state.loopPhase, state);

    // 2. Shadow Portal (behind Giratina when erupting, or split-composited when diving)
    const isDiving = state.giratina.clipRift !== null;
    if (state.rift.open > 0.005) {
      drawShadowRift(
        ctx, bCtxA,
        state.rift.x, state.rift.y,
        state.rift.w, state.rift.h,
        state.rift.open, elapsed, state.rift.intensity
      );
    }

    // 3. Giratina (Origin Forme)
    drawGiratinaOrigin(ctx, bCtxA, state.giratina);

    // Subtle foreground rift seam plasma wisps when Giratina is actively crossing the dimensional tear
    if (isDiving && state.rift.open > 0.05) {
      ctx.save();
      const rx = state.rift.x;
      const ry = state.rift.y;
      const hh = state.rift.h * 0.42 * state.rift.open;
      for (let i = 0; i < 8; i++) {
        const sy = ry + Math.sin(elapsed * 4.8 + i * 1.1) * hh;
        const sx = getRiftCenterX(rx, sy, ry, state.rift.h, elapsed);
        const wLen = (16 + (i % 3) * 10) * unit;
        ctx.strokeStyle = i % 3 === 0 ? 'rgba(255, 76, 128, 0.72)' : 'rgba(208, 134, 255, 0.76)';
        ctx.lineWidth = (1.2 + (i % 2) * 0.9) * unit;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx - wLen, sy + Math.sin(i + elapsed * 6) * 8 * unit);
        ctx.quadraticCurveTo(sx - wLen * 0.35, sy - 6 * unit, sx + 4 * unit, sy);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 4. Act 2 Pitch-Black Tension Darkness Overlay
    if (state.darkness > 0.004) {
      ctx.fillStyle = `rgba(3, 2, 7, ${state.darkness})`;
      ctx.fillRect(-120, -120, W + 240, H + 240);
    }

    // 5. Act 2 Glowing Red Eyes in Darkness & Pre-Eruption Cracks
    drawShatterCracks(ctx, bCtxA, state.crackProg, state.crackFade);
    drawDarknessEyes(ctx, bCtxA, elapsed, state.darkEyesAmt, state.darkEyesFlare);

    // 6. Act 3 Colossal Curved Ghost Slashes & Shadow Force Blast
    const slashLen = Math.hypot(W, H) * 0.94;
    drawGhostSlash(ctx, bCtxA, state.slash1Prog, -0.56, W * 0.64, H * 0.49, slashLen, 88 * unit);
    drawGhostSlash(ctx, bCtxA, state.slash2Prog, 0.60, W * 0.65, H * 0.50, slashLen * 1.02, -82 * unit);
    drawShadowForceBlast(ctx, bCtxA, elapsed, state.blastT);

    bCtxA.restore();
    ctx.restore();

    // 7. Multi-Scale Hardware-Smooth Additive Light Bloom Composite!
    // Downsample bloomA -> bloomB for wide soft atmospheric halo
    bCtxB.setTransform(1, 0, 0, 1, 0, 0);
    bCtxB.clearRect(0, 0, bloomB.width, bloomB.height);
    bCtxB.imageSmoothingEnabled = true;
    bCtxB.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;

    // Pass 1: Crisp inner bloom
    ctx.globalAlpha = 0.66 + state.blastGlow * 0.18;
    if ('filter' in ctx) ctx.filter = 'blur(6px)';
    ctx.drawImage(bloomA, 0, 0, W, H);

    // Pass 2: Wide cinematic atmospheric bloom
    ctx.globalAlpha = 0.54 + state.blastGlow * 0.24;
    if ('filter' in ctx) ctx.filter = 'blur(18px)';
    ctx.drawImage(bloomB, 0, 0, W, H);

    if ('filter' in ctx) ctx.filter = 'none';
    ctx.restore();

    // 8. Impact flash & subtle purple-white bloom wash on Shadow Force hits
    if (state.impactFlash > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const fg = ctx.createRadialGradient(W * 0.60, H * 0.50, 10, W * 0.60, H * 0.50, Math.hypot(W, H) * 0.72);
      fg.addColorStop(0, `rgba(248, 224, 255, ${state.impactFlash * 0.56})`);
      fg.addColorStop(0.42, `rgba(156, 62, 255, ${state.impactFlash * 0.42})`);
      fg.addColorStop(1, `rgba(22, 5, 42, ${state.impactFlash * 0.14})`);
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 9. Update understated cinematic HUD
    updateUI(elapsed, state.ui, state.darkness);

    requestAnimationFrame(renderFrame);
  }

  requestAnimationFrame(renderFrame);
})();
</script>
</body>
